{% extends "base.html" %}
{% block title %}Submit UTR | Charity Trust{% endblock %}
{% block content %}
  <div class="row g-4 justify-content-center">
    <div class="col-lg-7">
      <div class="p-4 bg-white rounded shadow-sm">
        <h1 class="h4 mb-2">Verify your donation</h1>
        <p class="text-muted mb-4">
          Amount: <span class="fw-semibold">₹ {{ (donation.amount_cents / 100) | round(2) }}</span>
        </p>
        <form method="POST" action="{{ url_for('public.donate_verify', donation_id=donation.id) }}" class="needs-validation" novalidate>
          <div class="mb-3">
            <label class="form-label">UTR number</label>
            <input type="text" name="utr" class="form-control" required minlength="6" value="{{ donation.utr or '' }}">
            <div class="form-text">Enter the transaction reference from your UPI app.</div>
          </div>
          <button type="submit" class="btn btn-dark w-100">Submit UTR</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
