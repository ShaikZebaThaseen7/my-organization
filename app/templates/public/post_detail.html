{% extends "base.html" %}
{% block title %}{{ post.title }} | Charity Trust{% endblock %}
{% block content %}
  <div class="card shadow-sm">
    {% if post.image_filename %}
      <img class="card-img-top" src="{{ url_for('static', filename='uploads/' ~ post.image_filename) }}" alt="">
    {% endif %}
    <div class="card-body">
      <h1 class="h4">{{ post.title }}</h1>
      <div class="text-muted small mb-3">{{ post.created_at.strftime('%Y-%m-%d') }}</div>
      <p class="mb-0" style="white-space: pre-wrap;">{{ post.content }}</p>
    </div>
  </div>
{% endblock %}
